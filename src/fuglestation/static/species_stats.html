<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artsstatistik</title>
    <link rel="stylesheet" href="/static/stats.css?v=20260726-species-filters" />
  </head>
  <body>
    <main class="stats-page species-page">
      <header class="species-hero">
        <a class="back-link" href="/stats">Tilbage</a>
        <div id="species-hero-image" class="species-hero-image"></div>
        <h1 id="species-title">Indlæser...</h1>
        <p id="species-latin" class="species-hero-latin"></p>
      </header>

      <section class="overview" aria-label="Artsoversigt">
        <div>
          <span>Fund</span>
          <strong id="species-detections">-</strong>
        </div>
        <div>
          <span>Optagelser</span>
          <strong id="species-recordings">-</strong>
        </div>
        <div>
          <span>Bedste match</span>
          <strong id="species-confidence">-</strong>
        </div>
      </section>

      <section class="species-timeline" aria-label="Først og senest hørt">
        <div>
          <div class="species-latest-line">
            <strong id="species-latest">-</strong>
            <button id="species-listen-button" class="species-listen-button" type="button" hidden>Lyt</button>
          </div>
          <audio id="species-latest-audio" class="species-latest-audio-player" controls hidden></audio>
        </div>
        <div class="species-first-block">
          <div class="species-first-line">
            <strong id="species-first">-</strong>
            <button id="species-history-toggle" class="species-history-toggle" type="button" aria-expanded="false" hidden>Vis historik</button>
          </div>
          <ol id="species-history-list" class="species-history-list" hidden></ol>
        </div>
      </section>

      <section class="panel" aria-label="Fund hen over døgnets timer">
        <div class="section-heading">
          <h2>Tid på døgnet</h2>
          <span id="species-peak-hour">-</span>
        </div>
        <div id="species-hour-chart" class="hour-chart"></div>
      </section>

      <section class="panel" aria-label="Fund hen over året">
        <div class="section-heading">
          <h2>Tid på året</h2>
          <span id="species-peak-month">-</span>
        </div>
        <div id="species-year-chart" class="year-chart"></div>
      </section>

      <footer class="stats-footer">
        <a href="/stats">Statistik</a>
        <a href="/">Vægvisning</a>
      </footer>
    </main>

    <script src="/static/species_stats.js?v=20260726-species-filters"></script>
  </body>
</html>
